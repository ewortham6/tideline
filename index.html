<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tideline</title>
<meta name="description" content="Fixing, making, and sailing. Mostly aboard Caroline.">
<!-- Swap this for self-hosted font files before the first entry goes up. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #fbfaf7;
    --ink: #111;
    --quiet: #555;
    --edge: rgba(17, 17, 17, 0.22);
    --water: rgba(32, 62, 82, 0.10);
    --hatch: rgba(17, 17, 17, 0.09);
    --sketch: none;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #15202a; --ink: #e8e3d8; --quiet: #9fb3bd;
      --edge: rgba(159, 179, 189, 0.35); --water: rgba(159, 179, 189, 0.12); --hatch: rgba(232, 227, 216, 0.10);
      --sketch: invert(0.92);
    }
  }
  html, body { margin: 0; background: var(--ground); color: var(--ink); }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 4rem;
    box-sizing: border-box;
    padding: 2.5rem 1.5rem;
    font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    font-size: 1.125rem;
    line-height: 1.55;
  }
  @media (max-width: 900px) { body { padding-right: 6rem; } }   /* keep text clear of the buoy on phones and tablets */
  header, main, footer { max-width: 40rem; width: 100%; margin: 0 auto; }
  footer { margin-top: auto; }
  .mark {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 500;
    font-size: 1.5rem;
    letter-spacing: -0.01em;
    text-decoration: none;
    color: var(--ink);
  }
  h1 {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 500;
    font-size: 2.125rem;
    letter-spacing: -0.01em;
    line-height: 1.2;
    margin: 0;
  }
  p { margin: 0; }
  footer { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 0.9375rem; color: var(--quiet); }
  a { color: inherit; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

  /* ---- The tide ----
     A buoy (drawn by hand) rides the right edge: top of the band is high water, bottom is low.
     Its waterline is one line; hover (or tap) and that same line draws out across the page. */
  .buoy {
    position: fixed; right: 1.5rem; top: 50vh; width: 72px; height: 48px;
    padding: 0; border: 0; background: none; cursor: pointer; z-index: 7;
    transition: top 60s linear;
  }
  .buoy:focus-visible { outline: 1px dotted var(--ink); outline-offset: 6px; }
  .buoy-window { position: absolute; left: -12px; top: -40px; width: 96px; height: 83px; overflow: hidden; }
  .buoy-body {
    position: absolute; left: 25.5px; top: 47.4px; width: 45px; height: 39.6px;
    transform-origin: 50% calc(100% - 4px); animation: bob 3.4s ease-in-out infinite;
  }
  .buoy-body img { display: block; width: 45px; height: 39.6px; filter: var(--sketch); }
  @keyframes bob { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }

  .tideline {
    position: fixed; left: 0; right: 0; top: 50vh; height: 16px; z-index: 6; pointer-events: none;
    clip-path: inset(-6px 0 -6px calc(100% - 6rem));
    transition: top 60s linear, clip-path 0.9s cubic-bezier(.2, .7, .2, 1);
  }
  .tideline svg { display: block; width: 100%; height: 16px; overflow: visible; }
  .tideline path { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; filter: url(#rough); }

  .takeover {
    position: fixed; inset: 0; z-index: 5; background: var(--ground);
    opacity: 0; pointer-events: none; transition: opacity 0.45s ease;
    font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 0.875rem; color: var(--quiet);
  }
  .takeover p { position: absolute; }
  .t-left { left: 1.5rem; }
  .t-right { right: 7rem; }
  @media (min-width: 901px) { .t-left { left: 3rem; } }
  .t-edge { position: absolute; left: 0; right: 0; height: 1px; background: var(--edge); }
  .t-water {
    position: absolute; left: 0; right: 0; bottom: 0; top: 50vh;
    background: repeating-linear-gradient(135deg, var(--hatch) 0 1px, transparent 1px 7px), var(--water);
    transition: top 60s linear;
  }
  .t-now { transition: top 60s linear; }

  /* Quiet marks at the ends of the buoy's travel, so its height reads as a tide without hovering. */
  .tick {
    position: fixed; right: 0.5rem; z-index: 4; transform: translateY(-50%);
    display: flex; align-items: center; gap: 4px;
    font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 0.6875rem; color: var(--quiet);
  }
  .tick::after { content: ""; width: 10px; height: 1px; background: var(--edge); }
  .tick[hidden] { display: none; }

  .tide-open .takeover { opacity: 1; }
  .tide-open .tideline { clip-path: inset(-6px 0 -6px 0); }
  .placing .buoy, .placing .tideline, .placing .t-water, .placing .t-now { transition: none; }
  @media (prefers-reduced-motion: reduce) {
    .buoy, .tideline, .t-water, .t-now, .takeover { transition: none; }
    .buoy-body { animation: none; }
  }
</style>
</head>
<body class="placing">
  <header>
    <a class="mark" href="/">Tideline</a>
  </header>

  <main>
    <h1>Fixing, making, and sailing. Mostly aboard Caroline. First entries early 2027.</h1>
  </main>

  <footer>
    <p>Caroline is a Bristol Channel Cutter 28, kept on San Francisco Bay.</p>
  </footer>

  <div class="takeover" id="takeover" aria-live="polite">
    <p class="t-left" style="top: 2.5rem" id="t-date"></p>
    <div class="t-edge" style="top: var(--bt, 14vh)"></div>
    <p class="t-left" style="top: calc(var(--bt, 14vh) - 1.6rem)">High</p>
    <p class="t-right" style="top: calc(var(--bt, 14vh) - 1.6rem)" id="t-high"></p>
    <div class="t-water" id="t-water"></div>
    <p class="t-right t-now" id="t-now"></p>
    <div class="t-edge" style="top: var(--bb, 86vh)"></div>
    <p class="t-left" style="top: calc(var(--bb, 86vh) + 0.5rem)">Low</p>
    <p class="t-right" style="top: calc(var(--bb, 86vh) + 0.5rem)" id="t-low"></p>
  </div>

  <div class="tick" id="tick-h" hidden aria-hidden="true" style="top: var(--bt, 14vh)">H</div>
  <div class="tick" id="tick-l" hidden aria-hidden="true" style="top: var(--bb, 86vh)">L</div>

  <div class="tideline" id="tideline" hidden aria-hidden="true">
    <svg id="tideline-svg" preserveAspectRatio="none">

      <path id="tideline-path"></path>
    </svg>
  </div>

  </button>

<script>
(function () {
  // NOAA CO-OPS high/low predictions for Alameda, CA (station 9414750), in UTC.
  // The buoy and its waterline sit between the high and low the tide is moving between,
  // on a cosine curve, recomputed every minute. Data refreshes every six hours.
  var STATION = '9414750', BAND_TOP = 0.14, BAND_SPAN = 0.72, WATERLINE = 42;
  var body = document.body;
  var buoy = document.getElementById('buoy');
  var tideline = document.getElementById('tideline');
  var svg = document.getElementById('tideline-svg');
  var path = document.getElementById('tideline-path');
  var water = document.getElementById('t-water');
  var nowEl = document.getElementById('t-now');
  var extremes = null, pct = 50, lastPointer = 'mouse', loadedAt = 0;

  function ymd(d) { return d.toISOString().slice(0, 10).replace(/-/g, ''); }
  function parseUTC(s) { return new Date(s.replace(' ', 'T') + 'Z'); }
  function fmtTime(d) {
    return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Los_Angeles' });
  }
  function fmtExtreme(e) { return fmtTime(e.t) + ', ' + e.v.toFixed(1) + ' ft'; }

  // One wave across the viewport, anchored to the right edge so the stretch under the buoy never changes.
  function drawLine() {
    var w = window.innerWidth, half = 80, x = w - half * Math.ceil(w / half + 1), d = 'M' + x + ' 8', first = true;
    while (x < w) {
      d += first ? ' Q ' + (x + half / 2) + ' 4.5 ' + (x + half) + ' 8' : ' T ' + (x + half) + ' 8';
      first = false; x += half;
    }
    svg.setAttribute('viewBox', '0 0 ' + w + ' 16');
    path.setAttribute('d', d);
  }

  function place() {
    var vh = window.innerHeight, y = vh * (BAND_TOP + BAND_SPAN * pct / 100);
    document.documentElement.style.setProperty('--bt', (vh * BAND_TOP) + 'px');
    document.documentElement.style.setProperty('--bb', (vh * (BAND_TOP + BAND_SPAN)) + 'px');
    buoy.style.top = (y - WATERLINE) + 'px';
    tideline.style.top = (y - 8) + 'px';
    water.style.top = y + 'px';
    nowEl.style.top = (pct > 50 ? y - 26 : y + 10) + 'px';   // keep the reading clear of the High / Low rows
  }

  function load() {
    var now = new Date();
    var from = new Date(now.getTime() - 86400000), to = new Date(now.getTime() + 2 * 86400000);
    var url = 'https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=predictions&interval=hilo'
      + '&station=' + STATION + '&datum=MLLW&units=english&time_zone=gmt&format=json&application=tideline.world'
      + '&begin_date=' + ymd(from) + '&end_date=' + ymd(to);
    fetch(url).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.predictions || !j.predictions.length) throw new Error('no data');
      loadedAt = Date.now();
      extremes = j.predictions.map(function (p) { return { t: parseUTC(p.t), v: parseFloat(p.v) }; });
      render();
    }).catch(function () { /* no data: the buoy stays hidden */ });
  }

  function render() {
    if (!extremes) return;
    var now = new Date(), prev = null, next = null;
    for (var i = 0; i < extremes.length; i++) {
      if (extremes[i].t <= now) prev = extremes[i];
      else { next = extremes[i]; break; }
    }
    if (!prev || !next) return;
    var high = prev.v > next.v ? prev : next, low = prev.v > next.v ? next : prev;
    var f = (now - prev.t) / (next.t - prev.t);
    var h = prev.v + (next.v - prev.v) * (1 - Math.cos(Math.PI * f)) / 2;
    pct = Math.max(0, Math.min(100, (high.v - h) / (high.v - low.v) * 100));
    document.getElementById('t-date').textContent = 'Alameda, ' + now.toLocaleDateString('en-US',
      { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'America/Los_Angeles' });
    document.getElementById('t-high').textContent = fmtExtreme(high);
    document.getElementById('t-low').textContent = fmtExtreme(low);
    nowEl.textContent = 'Now ' + h.toFixed(1) + ' ft, ' + (next.v > prev.v ? 'rising' : 'falling');
    buoy.setAttribute('aria-label', 'Tide at Alameda: ' + h.toFixed(1) + ' feet, ' + (next.v > prev.v ? 'rising' : 'falling'));
    place();
    if (buoy.hidden) {
      buoy.hidden = false; tideline.hidden = false;
      document.getElementById('tick-h').hidden = false; document.getElementById('tick-l').hidden = false;
      requestAnimationFrame(function () { requestAnimationFrame(function () { body.classList.remove('placing'); }); });
    }
  }

  // Open: hover on desktop; tap to open and tap again (or anywhere) to close on phones; Enter / Esc by keyboard.
  function setOpen(v) { body.classList.toggle('tide-open', v); buoy.setAttribute('aria-expanded', v ? 'true' : 'false'); }
  function isOpen() { return body.classList.contains('tide-open'); }
  document.addEventListener('pointerdown', function (e) {
    lastPointer = e.pointerType || 'mouse';
    if (isOpen() && lastPointer !== 'mouse' && !buoy.contains(e.target)) setOpen(false);
  });
  buoy.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') setOpen(true); });
  buoy.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') setOpen(false); });
  buoy.addEventListener('click', function (e) {
    if (e.detail === 0 || lastPointer !== 'mouse') setOpen(!isOpen());   // keyboard or touch
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });

  window.addEventListener('resize', function () {
    body.classList.add('placing'); drawLine(); place();
    requestAnimationFrame(function () { requestAnimationFrame(function () { body.classList.remove('placing'); }); });
  });

  function snap() {
    body.classList.add('placing'); render();
    requestAnimationFrame(function () { requestAnimationFrame(function () { body.classList.remove('placing'); }); });
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (Date.now() - loadedAt > 6 * 3600000) load(); else snap();
  });

  drawLine();
  load();
  setInterval(render, 60000);
  setInterval(load, 6 * 3600000);
})();
</script>
