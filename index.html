<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tideline</title>
<meta name="description" content="Fixing, making, and sailing. Mostly aboard Caroline.">
<!-- Swap this for self-hosted font files before the first entry goes up. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #fbfaf7;
    --ink: #111;
    --quiet: #555;
    --rule: #111;
    --edge: rgba(17, 17, 17, 0.22);
    --water: rgba(32, 62, 82, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root { --ground: #15202a; --ink: #e8e3d8; --quiet: #9fb3bd; --rule: #4e6572; --edge: rgba(159, 179, 189, 0.35); --water: rgba(159, 179, 189, 0.14); }
  }
  html, body { margin: 0; background: var(--ground); color: var(--ink); }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 4rem;
    box-sizing: border-box;
    padding: 2.5rem 1.5rem;
    font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    font-size: 1.125rem;
    line-height: 1.55;
  }
  header, main, footer, .tide { max-width: 40rem; width: 100%; margin: 0 auto; }
  footer { margin-top: auto; }
  .mark {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 500;
    font-size: 1.5rem;
    letter-spacing: -0.01em;
    text-decoration: none;
    color: var(--ink);
  }
  h1 {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 500;
    font-size: 1.75rem;
    letter-spacing: -0.01em;
    line-height: 1.2;
    margin: 0;
  }
  p { margin: 0; }
  .quiet { color: var(--quiet); }
  footer { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 0.9375rem; color: var(--quiet); }
  a { color: inherit; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

  /* The tide: a dotted line that sits at the current water height at Alameda,
     between the high and low it is moving between. */
  .tide { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 0.875rem; color: var(--quiet); }
  .tide-date { margin-bottom: 0.75rem; }
  .tide-edge { display: flex; justify-content: space-between; align-items: baseline; }
  .tide-band {
    position: relative; height: 6rem; margin: 0.375rem 0;
    border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge);
  }
  .tide-water {
    position: absolute; left: 0; right: 0; bottom: 0; top: 50%;
    background: var(--water);
    transition: top 60s linear;
  }
  .tide-line {
    position: absolute; left: 0; right: 0; top: 50%;
    height: 1px;
    background-image: linear-gradient(to right, var(--rule) 1px, transparent 1px);
    background-size: 6px 1px;
    transition: top 60s linear;
  }
  .tide-now {
    position: absolute; right: 0; top: calc(50% - 1.25rem);
    background: var(--ground); padding-left: 0.5rem;
    transition: top 60s linear;
  }
  .tide[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) { .tide-line, .tide-now, .tide-water { transition: none; } }
</style>
</head>
<body>
  <header>
    <a class="mark" href="/">Tideline</a>
  </header>

  <main>
    <h1>Fixing, making, and sailing. Mostly aboard Caroline. First entries early 2027.</h1>

  </main>

  <div class="tide" id="tide" hidden>
      <p class="tide-date" id="tide-date"></p>
      <div class="tide-edge"><span>High</span><span id="tide-high"></span></div>
      <div class="tide-band" aria-hidden="true">
        <div class="tide-water" id="tide-water"></div>
        <div class="tide-line" id="tide-line"></div>
        <span class="tide-now" id="tide-now"></span>
      </div>
      <div class="tide-edge"><span>Low</span><span id="tide-low"></span></div>
    </div>

  <footer>
    <p>Caroline is a Bristol Channel Cutter 28, kept on San Francisco Bay.</p>
  </footer>

<script>
(function () {
  // NOAA CO-OPS high/low predictions for Alameda, CA (station 9414750), in UTC.
  // The band runs from the low to the high the tide is currently moving between;
  // the line's height is a cosine interpolation between them, recomputed every minute.
  var STATION = '9414750';
  var tide = document.getElementById('tide');
  var line = document.getElementById('tide-line');
  var nowEl = document.getElementById('tide-now');
  var highEl = document.getElementById('tide-high');
  var lowEl = document.getElementById('tide-low');
  var dateEl = document.getElementById('tide-date');
  var extremes = null;

  function ymd(d) { return d.toISOString().slice(0, 10).replace(/-/g, ''); }
  function parseUTC(s) { return new Date(s.replace(' ', 'T') + 'Z'); }
  function fmtTime(d) {
    return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Los_Angeles' });
  }
  function fmtExtreme(e) { return fmtTime(e.t) + ', ' + e.v.toFixed(1) + ' ft'; }

  function load() {
    var now = new Date();
    var from = new Date(now.getTime() - 86400000), to = new Date(now.getTime() + 2 * 86400000);
    var url = 'https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=predictions&interval=hilo'
      + '&station=' + STATION + '&datum=MLLW&units=english&time_zone=gmt&format=json&application=tideline.world'
      + '&begin_date=' + ymd(from) + '&end_date=' + ymd(to);
    fetch(url).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.predictions || !j.predictions.length) throw new Error('no data');
      extremes = j.predictions.map(function (p) {
        return { t: parseUTC(p.t), v: parseFloat(p.v), type: p.type };
      });
      render();
    }).catch(function () { /* no data: the block stays hidden */ });
  }

  function render() {
    if (!extremes) return;
    var now = new Date(), prev = null, next = null;
    for (var i = 0; i < extremes.length; i++) {
      if (extremes[i].t <= now) prev = extremes[i];
      else { next = extremes[i]; break; }
    }
    if (!prev || !next) return;
    var high = prev.v > next.v ? prev : next, low = prev.v > next.v ? next : prev;
    var f = (now - prev.t) / (next.t - prev.t);                 // 0 at prev extreme, 1 at next
    var h = prev.v + (next.v - prev.v) * (1 - Math.cos(Math.PI * f)) / 2;
    var pct = (high.v - h) / (high.v - low.v) * 100;             // high water at the top edge
    pct = Math.max(2, Math.min(98, pct));
    line.style.top = pct.toFixed(2) + '%';
    document.getElementById('tide-water').style.top = pct.toFixed(2) + '%';
    // Keep the label clear of the High/Low rows: above the line in the lower half, below it in the upper half.
    nowEl.style.top = pct > 50 ? 'calc(' + pct.toFixed(2) + '% - 1.25rem)' : 'calc(' + pct.toFixed(2) + '% + 0.25rem)';
    nowEl.textContent = 'Now ' + h.toFixed(1) + ' ft, ' + (next.v > prev.v ? 'rising' : 'falling');
    dateEl.textContent = 'Alameda, ' + now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'America/Los_Angeles' });
    highEl.textContent = fmtExtreme(high);
    lowEl.textContent = fmtExtreme(low);
    tide.hidden = false;
  }

  load();
  setInterval(render, 60000);
  setInterval(load, 6 * 3600000);
})();
</script>
</body>
</html>
