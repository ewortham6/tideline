<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tideline</title>
<meta name="description" content="Fixing, making, and sailing. Mostly aboard Caroline.">
<!-- Swap this for self-hosted font files before the first entry goes up. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #fbfaf7;
    --ink: #111;
    --quiet: #555;
    --rule: #111;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ground: #15202a; --ink: #e8e3d8; --quiet: #9fb3bd; --rule: #4e6572; }
  }
  html, body { margin: 0; background: var(--ground); color: var(--ink); }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-sizing: border-box;
    padding: 2.5rem 1.5rem;
    font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    font-size: 1.125rem;
    line-height: 1.55;
  }
  header, main, footer { max-width: 40rem; width: 100%; margin: 0 auto; }
  .mark {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 500;
    font-size: 1.5rem;
    letter-spacing: -0.01em;
    text-decoration: none;
    color: var(--ink);
  }
  .rule {
    width: 100%;
    height: 1px;
    margin: 1.25rem 0 0;
    background-image: linear-gradient(to right, var(--rule) 1px, transparent 1px);
    background-size: 6px 1px;
  }
  h1 {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 500;
    font-size: 1.75rem;
    letter-spacing: -0.01em;
    line-height: 1.2;
    margin: 0 0 0.75rem;
  }
  p { margin: 0; }
  .quiet { color: var(--quiet); }
  footer { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 0.9375rem; color: var(--quiet); }
  a { color: inherit; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
</style>
</head>
<body>
  <header>
    <a class="mark" href="/">Tideline</a>
    <div class="rule" aria-hidden="true"></div>
  </header>

  <main>
    <h1>Fixing, making, and sailing. Mostly aboard Caroline.</h1>
    <p class="quiet">A log kept by Elliott and Sammy. First entries early 2027.</p>
  </main>

  <footer>
    <p>Caroline is a Bristol Channel Cutter 28, kept on San Francisco Bay.</p>
  </footer>
</body>
</html>
